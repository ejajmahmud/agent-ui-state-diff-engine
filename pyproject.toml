[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-ui-state-diff-engine"
version = "0.1.0"
description = "Perceptual and structural image differ identifying UI state transitions, loading spinners, and layout shifts across interaction frames"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
agent-ui-state-diff-engine = "agent_ui_state_diff_engine.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_ui_state_diff_engine*"]
